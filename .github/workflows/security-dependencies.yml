name: Security dependency verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix desktop ci --no-audit --no-fund
      - run: npm run licenses:check
      - run: npm run lint
      - run: npm run typecheck && npm run relay:typecheck
      - run: npm test && npm run test:public && npm run check:public
      - run: npm run build
      - run: npm --prefix desktop test && npm --prefix desktop run typecheck
      - run: npm --prefix desktop run build
      - run: npm --prefix desktop run verify:bridge
      - run: npm --prefix desktop run verify:desktop
      - name: Verify actual Electron version and Node/Chromium TLS
        run: node_modules/.bin/electron scripts/verify-electron-security.mjs
        working-directory: desktop
      - name: Build unsigned validation package (not a release)
        run: npm run desktop:package
      - name: Check validation package outputs
        shell: pwsh
        run: |
          if (!(Test-Path desktop/out/RunMeter-win32-x64/RunMeter.exe)) { throw 'Missing executable' }
          if (!(Test-Path desktop/out/RunMeter-win32-x64/resources/app.asar)) { throw 'Missing app archive' }
          Write-Output 'Unsigned validation package built from pinned Electron; not distributed.'
