<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <title>RunMeter — 接続を確認してください</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #090d12; color: #f1f5f9; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { max-width: 32rem; padding: 2rem; }
      h1 { font-size: 1.5rem; line-height: 1.5; }
      p { color: #b9c2ce; line-height: 1.8; }
      a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; border-radius: .4rem; background: #e2e8f0; color: #111827; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #60a5fa; outline-offset: 4px; }
      small { display: block; margin-top: 2rem; color: #94a3b8; line-height: 1.8; }
    </style>
  </head>
  <body>
    <main>
      <p>RunMeter</p>
      <h1>画面に接続できませんでした</h1>
      <p>インターネット接続を確認してから、もう一度お試しください。端末に保存された接続情報や利用履歴は保持されています。</p>
      <a href="https://run-meter.vercel.app/">もう一度読み込む</a>
      <small>RunMeterは通知領域でも動作しています。右下のアイコンから再読み込みや終了を選べます。</small>
    </main>
  </body>
</html>
